name: YDesk sync upstream

# Upstream sync is manual by design. This fork renames the Android package
# (com.carriez.flutter_hbb -> com.ydesk.app) and carries its own signing
# fingerprints, so upstream changes to Android sources have to be reconciled
# by hand or the rename conflicts. The hbb_common submodule is likewise pinned
# to the wisfern/hbb_common fork's main (whose own sync runs 30 minutes
# earlier), not to upstream's pointer: only the fork carries our server config
# constants.
#
# So this workflow never merges and never pushes - it only reports what is
# pending. A failing run means "merge upstream locally, then push".

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ydesk-sync-upstream

jobs:
  check:
    if: github.repository == 'wisfern/rustdesk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Report pending upstream changes
        env:
          # The hbb_common fork is private, so GITHUB_TOKEN cannot read it.
          HBB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HBB_TOKEN" | base64 -w0)"
          report=/tmp/report.md
          : > "$report"
          note() { printf '%s\n' "$*" >> "$report"; }
          code() { note '```'; "$@" >> "$report"; note '```'; }

          git remote add upstream https://github.com/rustdesk/rustdesk.git
          git fetch --quiet upstream +refs/heads/master:refs/remotes/upstream/master
          git remote add hbbfork https://github.com/wisfern/hbb_common.git
          git -c "http.extraheader=$auth" \
            fetch --quiet hbbfork +refs/heads/main:refs/remotes/hbbfork/main
          fork_tip=$(git rev-parse hbbfork/main)
          pinned=$(git rev-parse HEAD:libs/hbb_common)

          upstream_ahead=0
          git merge-base --is-ancestor upstream/master HEAD || upstream_ahead=1
          if [ "$upstream_ahead" = 0 ] && [ "$fork_tip" = "$pinned" ]; then
            echo "Already up to date with upstream/master and the hbb_common fork."
            exit 0
          fi

          note "## 上游有变更待手工合并"
          note
          if [ "$upstream_ahead" = 1 ]; then
            commits=$(git rev-list --count HEAD..upstream/master)
            note "upstream/master 领先 ${commits} 个提交（$(git rev-parse --short upstream/master)）："
            note
            code git log --oneline HEAD..upstream/master
            note
            note "### 变更文件"
            code git diff --name-status HEAD upstream/master
          else
            commits=0
          fi

          android=$(git diff --name-only HEAD upstream/master -- flutter/android libs/scrap/src/android || true)
          android_other=$(git diff --name-only HEAD upstream/master | grep -E '^(.*\.(kt|java|gradle|pro)$|.*AndroidManifest\.xml$)' || true)
          android_files=$(printf '%s\n%s\n' "$android" "$android_other" | sed '/^$/d' | sort -u)
          android_n=0
          if [ -n "$android_files" ]; then
            android_n=$(printf '%s\n' "$android_files" | wc -l)
            note
            note "### :warning: 涉及安卓源码（${android_n} 个文件）"
            note "本 fork 的包名是 com.ydesk.app、指纹也是自己的，合并后要手工对齐："
            code printf '%s\n' "$android_files"
          fi

          pin_changed=0
          if [ "$fork_tip" != "$pinned" ]; then
            pin_changed=1
            note
            note "### hbb_common 指针"
            note "fork main 已到 \`${fork_tip}\`，父仓库还钉在 \`${pinned}\`，合并后需重钉。"
          fi

          conflict_state=""
          if [ "$upstream_ahead" = 1 ]; then
            note
            note "### 预合并"
            if git merge --no-commit --no-ff upstream/master >/tmp/preview.txt 2>&1; then
              note "无冲突。"
            else
              conflicts=$(git diff --name-only --diff-filter=U || true)
              if [ -n "$conflicts" ]; then
                note "有冲突："
                code printf '%s\n' "$conflicts"
              else
                note "预合并失败，输出如下："
                code cat /tmp/preview.txt
              fi
            fi
            git merge --abort >/dev/null 2>&1 || true
          fi

          note
          note "### 手工合并"
          note '```'
          note "git fetch https://github.com/rustdesk/rustdesk.git master"
          note "git merge FETCH_HEAD"
          note "git fetch https://github.com/wisfern/hbb_common.git main:hbbfork-main"
          note "git update-index --cacheinfo 160000,${fork_tip},libs/hbb_common"
          note "git commit --amend --no-edit   # 没有 MERGE_HEAD 时用 git commit"
          note "git push"
          note '```'

          cat "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

          msg="${commits} 个上游提交待合并"
          if [ "$android_n" -gt 0 ]; then
            msg="${msg}；${android_n} 个安卓相关文件需要手工对齐包名"
          fi
          if [ "$pin_changed" = 1 ]; then
            msg="${msg}；hbb_common 指针落后"
          fi
          echo "::error::${msg}。同步是手动的：请在本地合并并推送，详见 step summary"
          exit 1

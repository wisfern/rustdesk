name: YDesk sync upstream

# Auto-merge rustdesk/rustdesk master into this fork so it keeps following
# upstream. The hbb_common submodule is pinned to the wisfern/hbb_common
# fork's main (whose own sync runs 30 minutes earlier), not to upstream's
# pointer: only the fork carries our server config constants.

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ydesk-sync-upstream

jobs:
  sync:
    if: github.repository == 'wisfern/rustdesk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: master
          fetch-depth: 0
          # auth headers are passed per git command below; a persisted
          # repo-wide header would be sent twice together with the scoped
          # one (http.<url>.extraheader is multi-valued) and GitHub 400s
          persist-credentials: false

      - name: Merge upstream master
        env:
          GH_TOKEN: ${{ github.token }}
          # The PAT handles all authenticated git traffic: the hbb_common
          # fork is private (GITHUB_TOKEN only covers this repo), and pushes
          # touching workflow files are only accepted from a token with the
          # workflow scope - neither GITHUB_TOKEN nor a scopeless PAT can
          HBB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HBB_TOKEN" | base64 -w0)"

          close_manual_push_issue() {
            local n
            n=$(gh issue list --state open --search 'in:title "Upstream sync needs manual push"' --json number --jq '.[0].number // empty')
            if [ -n "$n" ]; then
              gh issue close "$n" --comment "Sync is current again."
            fi
          }

          git remote add upstream https://github.com/rustdesk/rustdesk.git
          git fetch upstream +refs/heads/master:refs/remotes/upstream/master
          git remote add hbbfork https://github.com/wisfern/hbb_common.git
          git -c "http.extraheader=$auth" \
            fetch hbbfork +refs/heads/main:refs/remotes/hbbfork/main
          fork_tip=$(git rev-parse hbbfork/main)

          upstream_ahead=0
          git merge-base --is-ancestor upstream/master HEAD || upstream_ahead=1
          if [ "$upstream_ahead" = 0 ] && [ "$fork_tip" = "$(git rev-parse HEAD:libs/hbb_common)" ]; then
            close_manual_push_issue
            echo "Already up to date"
            exit 0
          fi

          if [ "$upstream_ahead" = 1 ]; then
            if ! git merge upstream/master --no-edit --no-commit; then
              conflicted="$(git diff --name-only --diff-filter=U)"
              if [ "$conflicted" != "libs/hbb_common" ]; then
                git merge --abort || true
                {
                  echo "Merging upstream/master $(git rev-parse --short upstream/master) conflicts with local changes in:"
                  echo '```'
                  echo "$conflicted"
                  echo '```'
                  echo "Resolve locally and push; the next scheduled run continues from there:"
                  echo '```'
                  echo "git fetch https://github.com/rustdesk/rustdesk.git master"
                  echo "git merge FETCH_HEAD"
                  echo "# resolve conflicts, then: git commit && git push"
                  echo '```'
                } > /tmp/issue-body.md
                if [ -z "$(gh issue list --state open --search 'in:title "Upstream sync failed"' --json number --jq '.[0].number // empty')" ]; then
                  gh issue create --title "Upstream sync failed" --body-file /tmp/issue-body.md
                fi
                echo "::error::merge conflict with upstream/master"
                exit 1
              fi
            fi
          fi

          # upstream's submodule pointer targets rustdesk/hbb_common, which
          # lacks our server config constants; pin the fork's main instead
          # (this also resolves the expected gitlink conflict)
          git update-index --cacheinfo 160000,"$fork_tip",libs/hbb_common
          if [ -e "$(git rev-parse --git-dir)/MERGE_HEAD" ]; then
            git commit --no-edit
          else
            git commit -m "chore: update hbb_common to the fork's main"
          fi
          if ! git -c "http.extraheader=$auth" push origin master 2>/tmp/push-err.txt; then
            if grep -q "refusing to allow" /tmp/push-err.txt; then
              # the merge touches workflow files; only a token with the
              # workflow scope may push those, which this fork's sync token
              # deliberately lacks - flag for a manual push instead of
              # failing every scheduled run
              {
                echo "定时同步已在 CI 里把 upstream/master（$(git rev-parse --short upstream/master)）合并进 master，但合并包含 workflow 文件改动，推送被 GitHub 拒绝（token 无 workflow scope，本 fork 有意不加）。请在本地合并推送："
                echo
                echo '```'
                echo "git fetch https://github.com/rustdesk/rustdesk.git master"
                echo "git merge FETCH_HEAD"
                echo "git push"
                echo '```'
                echo
                echo "本次合并涉及的文件："
                echo '```'
                git diff --name-only HEAD^1 HEAD
                echo '```'
                echo
                echo "处理完成后，本 issue 会在下一次成功同步时自动关闭。"
              } > /tmp/issue-body.md
              if [ -z "$(gh issue list --state open --search 'in:title "Upstream sync needs manual push"' --json number --jq '.[0].number // empty')" ]; then
                gh issue create --title "Upstream sync needs manual push" --body-file /tmp/issue-body.md
              fi
              echo "::warning::sync merged but push rejected (workflow scope); manual push needed, see issue"
              exit 0
            fi
            cat /tmp/push-err.txt >&2
            exit 1
          fi
          close_manual_push_issue
